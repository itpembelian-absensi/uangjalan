name: Deploy

# Self-hosted runner di server produksi (/srv/docker/uangjalan).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Deploy production
        env:
          DEPLOY_PATH: /srv/docker/uangjalan
          GIT_SHA: ${{ github.sha }}
          BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "==> host=$(hostname 2>/dev/null || echo unknown) user=$(whoami) pwd=$(pwd)"
          echo "==> DEPLOY_PATH=${DEPLOY_PATH}"
          echo "==> GIT_SHA=${GIT_SHA}"

          command -v bash >/dev/null || fail "bash tidak ditemukan"
          command -v git >/dev/null || fail "git tidak ditemukan"
          command -v npm >/dev/null || fail "npm tidak ditemukan"
          command -v docker >/dev/null || fail "docker tidak ditemukan"
          docker compose version >/dev/null 2>&1 || fail "docker compose tidak tersedia"
          command -v node >/dev/null || fail "node tidak ditemukan"
          command -v curl >/dev/null || fail "curl tidak ditemukan"

          [ -d "${DEPLOY_PATH}" ] || fail "Folder deploy tidak ada: ${DEPLOY_PATH}"
          [ -d "${DEPLOY_PATH}/.git" ] || fail "Bukan git repo: ${DEPLOY_PATH}"
          [ -f "${DEPLOY_PATH}/.env" ] || fail "File .env tidak ada di ${DEPLOY_PATH}"

          cd "${DEPLOY_PATH}"

          echo "==> Pre-clean __pycache__"
          find backend -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find backend -type f -name '*.pyc' -delete 2>/dev/null || true
          rm -f actions.json jobs.json 2>/dev/null || true
          if find backend -type d -name '__pycache__' 2>/dev/null | grep -q .; then
            echo "==> sudo clean root-owned pycache"
            sudo -n find backend -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            sudo -n chown -R "$(id -u):$(id -g)" backend scripts frontend .git 2>/dev/null || true
          fi

          echo "==> Sync ${GIT_SHA}"
          git config --global --add safe.directory "${DEPLOY_PATH}" 2>/dev/null || true
          git fetch origin "${BRANCH}" --tags --force || fail "git fetch gagal"
          if ! git reset --hard "${GIT_SHA}"; then
            echo "==> git reset gagal, retry chown"
            sudo -n chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
            find backend -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            git reset --hard "${GIT_SHA}" || fail "git reset --hard gagal (izin file?)"
          fi
          echo "Active commit: $(git log -1 --oneline)"
          [ "$(git rev-parse HEAD)" = "${GIT_SHA}" ] || fail "HEAD tidak sama dengan GIT_SHA"

          echo "==> Run deploy.sh"
          set +e
          bash "${DEPLOY_PATH}/scripts/deploy.sh" 2>&1 | tee /tmp/uangjalan-deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "${code}" -ne 0 ]; then
            echo "## Deploy.sh gagal (exit ${code})" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 40 /tmp/uangjalan-deploy.log >> "${GITHUB_STEP_SUMMARY}" || true
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            last="$(tail -n 5 /tmp/uangjalan-deploy.log | tr '\n' ' | ' | cut -c1-200)"
            fail "deploy.sh exit ${code}: ${last}"
          fi
          echo "==> Deploy selesai"
