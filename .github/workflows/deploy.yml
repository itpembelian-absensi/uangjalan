name: Deploy

# Self-hosted runner harus terpasang di server produksi (/srv/docker/uangjalan).
# Deploy: bersihkan junk → git sync → npm build frontend → docker compose restart.
# File .env tetap di server (tidak dihapus oleh workflow ini).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Cukup label self-hosted — hindari job menggantung karena label custom hilang.
    # Opsional: tambahkan label "uangjalan" di runner, lalu ganti menjadi [self-hosted, uangjalan].
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Deploy production
        env:
          DEPLOY_PATH: /srv/docker/uangjalan
          GIT_SHA: ${{ github.sha }}
          BRANCH: main
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          echo "==> Pre-clean (agar git reset tidak gagal karena __pycache__/file kotor)"
          # Hapus bytecode & junk; coba sudo -n jika file root-owned
          clean_pycache() {
            find backend -type d -name '__pycache__' -prune -print0 2>/dev/null \
              | xargs -0 -r rm -rf 2>/dev/null || true
            find backend -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete 2>/dev/null || true
            rm -f actions.json jobs.json 2>/dev/null || true
          }
          clean_pycache
          if ! clean_pycache 2>/dev/null; then
            true
          fi
          # Jika masih ada sisa yang tidak bisa dihapus runner-user, coba passwordless sudo
          if find backend -type d -name '__pycache__' 2>/dev/null | grep -q .; then
            echo "==> Mencoba sudo untuk bersihkan __pycache__ root-owned"
            sudo -n find backend -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            sudo -n find backend -type f -name '*.pyc' -delete 2>/dev/null || true
            sudo -n chown -R "$(id -u):$(id -g)" backend scripts frontend .git 2>/dev/null || true
          fi

          echo "==> Sync code ke ${GIT_SHA}"
          git config --global --add safe.directory "${DEPLOY_PATH}" 2>/dev/null || true
          git fetch origin "${BRANCH}" --tags --force
          if ! git reset --hard "${GIT_SHA}"; then
            echo "==> git reset gagal — retry setelah chown"
            sudo -n chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
            clean_pycache
            git reset --hard "${GIT_SHA}"
          fi
          echo "Active commit: $(git log -1 --oneline)"
          test "$(git rev-parse HEAD)" = "${GIT_SHA}"

          echo "==> Jalankan deploy.sh (sudah versi commit ini)"
          bash "${DEPLOY_PATH}/scripts/deploy.sh"
