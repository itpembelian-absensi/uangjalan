{% extends "base.html" %}
{% block content %}
  <div class="grid">
    <div class="card">
      <h2 style="margin:0 0 10px">Master Kendaraan (Plat)</h2>
      <form method="post" action="/ui/vehicles">
        <div class="row">
          <div class="col-4">
            <label>Plat mobil</label>
            <input name="plate_number" placeholder="B 1234 ABC" required />
          </div>
          <div class="col-4">
            <label>Merek</label>
            <select name="brand_id" required>
              {% for b in brands %}
                <option value="{{ b.id }}">{{ b.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-4">
            <label>Jenis</label>
            <select name="type_id" required>
              {% for t in types %}
                <option value="{{ t.id }}">{{ t.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <button type="submit">Simpan</button>
          </div>
        </div>
      </form>
      <div class="muted" style="margin-top:8px">Pastikan merek & jenis sudah diisi dulu.</div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px">Daftar Kendaraan</h3>
      <table>
        <thead><tr><th>ID</th><th>Plat</th><th>Merek</th><th>Jenis</th><th></th></tr></thead>
        <tbody>
          {% for v in vehicles %}
            <tr>
              <td>{{ v.id }}</td>
              <td>
                <form method="post" action="/ui/vehicles/{{ v.id }}/update" style="display:flex; gap:8px; align-items:center;">
                  <input name="plate_number" value="{{ v.plate_number }}" required />
                  <select name="brand_id" required>
                    {% for b in brands %}
                      <option value="{{ b.id }}" {% if b.id == v.brand_id %}selected{% endif %}>{{ b.name }}</option>
                    {% endfor %}
                  </select>
                  <select name="type_id" required>
                    {% for t in types %}
                      <option value="{{ t.id }}" {% if t.id == v.type_id %}selected{% endif %}>{{ t.name }}</option>
                    {% endfor %}
                  </select>
                  <button type="submit" class="btn-secondary btn-sm">Update</button>
                </form>
              </td>
              <td>{{ brand_map.get(v.brand_id, v.brand_id) }}</td>
              <td>{{ type_map.get(v.type_id, v.type_id) }}</td>
              <td class="right">
                <form method="post" action="/ui/vehicles/{{ v.id }}/delete" onsubmit="return confirm('Hapus kendaraan ini?');">
                  <button type="submit" class="btn-danger btn-sm">Hapus</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
