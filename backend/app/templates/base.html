<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uang Pengiriman</title>
    <style>
      :root { --fg:#111827; --muted:#6b7280; --bg:#f9fafb; --card:#ffffff; --line:#e5e7eb; --btn:#111827; --btnfg:#fff; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; color:var(--fg); background:var(--bg); }
      header { background:var(--card); border-bottom:1px solid var(--line); }
      .wrap { max-width: 1100px; margin:0 auto; padding: 16px; }
      nav a { margin-right: 12px; color: var(--fg); text-decoration:none; font-weight:600; }
      nav a:hover { text-decoration:underline; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      .muted { color: var(--muted); }
      .grid { display:grid; grid-template-columns: 1fr; gap: 12px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius: 12px; padding: 12px; }
      table { width:100%; border-collapse:collapse; }
      th, td { border-top:1px solid var(--line); padding: 8px; text-align:left; }
      th { color:var(--muted); font-size: 12px; letter-spacing:.02em; text-transform:uppercase; }
      input, select { padding:8px; border:1px solid var(--line); border-radius: 10px; width: 100%; box-sizing:border-box; }
      label { display:block; font-size:12px; color:var(--muted); margin-bottom: 6px; }
      .row { display:grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
      .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; } .col-6 { grid-column: span 6; } .col-12 { grid-column: span 12; }
      button, .btn-secondary { background:var(--btn); color:var(--btnfg); border:0; padding:10px 12px; border-radius: 10px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
      button:hover, .btn-secondary:hover { opacity:.92; }
      .btn-danger { background:#b91c1c; color:#fff; }
      .btn-sm { padding:6px 10px; font-size:12px; }
      .btn-secondary { background:#374151; }
      a { color: #1d4ed8; }
      .right { text-align:right; }
      @media (max-width: 800px) { .col-3,.col-4,.col-6 { grid-column: span 12; } }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Uang Pengiriman</h1>
        <div class="muted">Kontrol & pengeluaran uang pengiriman untuk supir</div>
        <div style="height:10px"></div>
        <nav>
          <a href="/ui">Beranda</a>
          <a href="/ui/customers">Customer</a>
          <a href="/ui/vehicle-brands">Merek</a>
          <a href="/ui/vehicle-types">Jenis</a>
          <a href="/ui/vehicles">Kendaraan</a>
          <a href="/ui/drivers">Supir</a>
          <a href="/ui/disbursements">Pengeluaran</a>
          <a href="/ui/reports">Laporan</a>
          <a href="/docs">API</a>
          {% if request.session.get("user_id") %}
            <form method="post" action="/ui/logout" style="display:inline;">
              <button type="submit" class="btn-secondary btn-sm">Logout</button>
            </form>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
